name: '[AU4] Check: Unit Tests (utest)'

on:
  pull_request:
  workflow_dispatch:
    inputs:
      code_coverage:
        description: 'Enable code coverage'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 3 * * 4" # Every Thursday night at 03:00 for master branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_DIR: buildscripts/ci

jobs:
  run_tests:
    # 24.04 rather than 22.04 because generating the video fixtures needs an
    # ffmpeg built with SVT-AV1, which jammy's 4.4.2 is not. See
    # tools/videosync/make_fixtures.py.
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: "Configure workflow"
      run: |
        cmake -DEVENT=${{ github.event_name }} \
              -DBUILD_MODE="devel_build" \
              -DARTIFACT_INFO="build.artifacts/" \
              -P ${CI_DIR}/common/ci_configure.cmake

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{github.workflow}}-${{runner.arch}}-ccache-
        restore-keys: ${{github.workflow}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Free up disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.1'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh

    # The video tests decode real files. Without them roughly half of
    # au_video_tests skips itself and the job still reports green, so the
    # fixtures are generated here rather than left to chance. They are large,
    # so they are cached on the generator and the ffmpeg build that made them.
    - name: Hash the fixture inputs
      id: fixture-key
      run: |
        echo "hash=$(ffmpeg -version | head -n1 | sha1sum | cut -c1-12)-$(sha1sum tools/videosync/make_fixtures.py | cut -c1-12)" | tee -a $GITHUB_OUTPUT

    - name: Restore video fixtures
      id: restore-fixtures
      uses: actions/cache/restore@v5
      with:
        path: tools/videosync/fixtures
        key: video-fixtures-${{ runner.arch }}-${{ steps.fixture-key.outputs.hash }}

    - name: Generate video fixtures
      if: steps.restore-fixtures.outputs.cache-hit != 'true'
      run: |
        python3 tools/videosync/make_fixtures.py
        python3 tools/videosync/make_fixtures.py --verify

    - name: Save video fixtures
      if: steps.restore-fixtures.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: tools/videosync/fixtures
        key: video-fixtures-${{ runner.arch }}-${{ steps.fixture-key.outputs.hash }}

    - name: Build
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CODE_COVERAGE: ${{ inputs.code_coverage }}
      run: |

        ENABLE_CODE_COVERAGE='false'

        if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$CODE_COVERAGE" == "true" ]]; then
          ENABLE_CODE_COVERAGE='true'
        else
          ENABLE_CODE_COVERAGE='false'
        fi

        source $HOME/build_tools/environment.sh
        cmake -DBUILD_ENABLE_CODE_COVERAGE=${ENABLE_CODE_COVERAGE} -P ${CI_DIR}/linux/ci_build_utests.cmake

    - name: Show ccache stats
      run: |
        ccache -sv

    - name: Run tests
      run: |
        cmake -P ${CI_DIR}/linux/ci_run_utests.cmake
      env:
        ASAN_OPTIONS: "detect_leaks=0"

    - name: Code coverage
      if: github.event_name == 'schedule' || inputs.code_coverage == true
      run: |
        lcov --capture --directory "$(pwd)/build.debug/" --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/thirdparty/*' '*/moc_*' '*framework/Headers/*' '*/hb-*' '*/Qt/*' --output-file filtered_coverage.info

        COVERAGE=$(lcov --summary filtered_coverage.info --ignore-errors inconsistent,corrupt,unsupported,empty,negative,mismatch,gcov | grep -oP 'lines\.+:\s+\K[0-9.]+')
        python3 buildscripts/ci/linux/tools/lcov_badger.py "${COVERAGE}" coverage_badge.svg

    - name: Push to S3
      if: ( github.event_name == 'schedule' || inputs.code_coverage ) && github.repository == 'audacity/audacity'
      run: |
        S3_URL='s3://extensions.musescore.org/test/code_coverage/au_coverage_badge.svg'

        bash ./buildscripts/ci/tools/s3_push_file.sh \
          --s3_key '${{ secrets.S3_KEY }}' \
          --s3_secret '${{ secrets.S3_SECRET }}' \
          --s3_url "${S3_URL}" \
          --file_path "coverage_badge.svg" \
          --cache_control "max-age=300"

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache
