name: '[AU4] Build: Sources'

# The source archive of a release, audacity-sources-<version>.tar.xz: the tracked
# files with the dependency sources of an offline build. No compiler involved.

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        required: true
  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      build_number:
        description: 'Build number shared with the other platforms (default: generated by this run)'
        type: string
        required: false
        default: ''

concurrency:
  # When called by another workflow, github.workflow is the caller's name: a '[AU4] Build: All'
  # run and a direct run of this workflow on the same ref must not cancel each other.
  group: ${{ github.workflow }}-au4_build_sources-${{ github.ref }}-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  CI_DIR: buildscripts/ci

jobs:
  au4_build_sources:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure workflow
      env:
        BUILD_NUMBER: ${{ inputs.build_number }}
      run: |
        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        BUILD_MODE=${{ inputs.build_mode || github.event.inputs.build_mode }}

        cmake -DEVENT=${{ github.event_name }} \
              -DBUILD_MODE=${BUILD_MODE} \
              -DBUILD_NUMBER=${BUILD_NUMBER} \
              -DARTIFACT_INFO="Sources${ADD_INFO}" \
              -P ${CI_DIR}/common/ci_configure.cmake

        echo "UPLOAD_ARTIFACT_NAME=$(cat ./build.artifacts/env/upload_artifact_name.env)" | tee -a $GITHUB_ENV

    - name: Package
      run: |
        cmake -P ${CI_DIR}/sources/package.cmake

    - name: Checksum
      run: |
        bash ./muse/buildscripts/ci/tools/checksum.sh

    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: ./build.artifacts/
