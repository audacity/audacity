name: '[AU4] Build: Linux'

on:
  pull_request:
    branches:
    - master

  schedule:
    - cron: '0 3 */1 */1 *' # At 03:00 on every day-of-month for master
  #   - cron: '0 5 */1 */1 *' # At 05:00 on every day-of-month for current release branch
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel_build, nightly_build, testing_build, stable_build'
        required: true
        default: 'devel_build'
      sentry_project:
        description: 'Upload symbols and dumps to Sentry (choose a project): au4(default for stable build), au4-sandbox'
        required: false
        default: ''

  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode (devel_build, nightly_build, testing_build, stable_build)'
        type: string
        required: false
        default: 'devel_build'
      app_repo:
        description: 'owner/repo to source Audacity from (default: this repo)'
        type: string
        required: false
        default: ''
      app_ref:
        description: 'Audacity ref to check out (default: ref of triggering event)'
        type: string
        required: false
        default: ''
      framework_repo:
        description: 'owner/repo to source muse_framework from (default: pinned submodule)'
        type: string
        required: false
        default: ''
      framework_ref:
        description: 'Ref to check out into the muse_framework submodule (default: pinned SHA)'
        type: string
        required: false
        default: ''

concurrency:
  group: au4_build_linux-${{ github.ref }}-${{ inputs.framework_ref || '' }}
  cancel-in-progress: true

env:
  CI_DIR: buildscripts/ci

jobs:
  au4_build_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64,  qt_host: linux,       qt_arch: linux_gcc_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.app_repo || github.repository }}
        ref: ${{ inputs.app_ref || github.ref }}
        submodules: recursive

    - name: Override muse_framework
      if: inputs.framework_ref != '' || github.event_name == 'schedule'
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.framework_repo || 'musescore/muse_framework' }}
        ref: ${{ inputs.framework_ref || 'main' }}
        path: muse
        submodules: recursive

    - name: "Configure workflow"
      env:
        pull_request_title: ${{ github.event.pull_request.title }}
        SENTRY_SERVER_AU4_KEY: ${{ secrets.SENTRY_SERVER_AU4_KEY }}
        SENTRY_SERVER_AU4_SANDBOX_KEY: ${{ secrets.SENTRY_SERVER_AU4_SANDBOX_KEY }}
        SENTRY_PROJECT: ${{ github.event.inputs.sentry_project }}
      run: |

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "schedule" ] && [ "${{ github.event.schedule }}" == "0 5 */1 */1 *" ]; then ADD_INFO="_${{ env.CURRENT_RELEASE_BRANCH }}"; fi
        if [ "${{ github.event_name }}" == "pull_request" ]; then ADD_INFO="_${{ github.event.pull_request.number }}_${pull_request_title}"; fi

        BUILD_MODE=${{ inputs.build_mode || github.event.inputs.build_mode }}

        cmake -DEVENT=${{ github.event_name }} \
              -DBUILD_MODE=${BUILD_MODE} \
              -DARTIFACT_INFO="Lin_${{ matrix.arch }}${ADD_INFO}" \
              -P ${CI_DIR}/common/ci_configure.cmake

        DO_BUILD='true'
        UPLOAD_ARTIFACT_NAME=$(cat ./build.artifacts/env/artifact_name.env)

        DO_UPLOAD_SYMBOLS='false'
        SENTRY_URL=""

        if [ "$SENTRY_SERVER_AU4_KEY" != "" ]; then
          if [ -z "$SENTRY_PROJECT" ] && [ "$BUILD_MODE" == "stable_build" ]; then
            SENTRY_PROJECT="au4"
          fi

          if [ "$SENTRY_PROJECT" == "au4" ]; then
            DO_UPLOAD_SYMBOLS='true'
            SENTRY_URL=https://sentry.audacityteam.org/api/4/minidump/?sentry_key=$SENTRY_SERVER_AU4_KEY
          fi
        fi

        if [ -z "$SENTRY_PROJECT" ] && [ "$BUILD_MODE" == "nightly_build" ]; then
          SENTRY_PROJECT="au4-sandbox"
        fi

        if [ "$SENTRY_PROJECT" == "au4-sandbox" ] && [ "$SENTRY_SERVER_AU4_SANDBOX_KEY" != "" ]; then
          DO_UPLOAD_SYMBOLS='true'
          SENTRY_URL=https://sentry.audacityteam.org/api/5/minidump/?sentry_key=$SENTRY_SERVER_AU4_SANDBOX_KEY
        fi

        echo "DO_BUILD=$DO_BUILD" >> $GITHUB_ENV
        echo "DO_BUILD: $DO_BUILD"
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" >> $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME: $UPLOAD_ARTIFACT_NAME"

        echo "DO_UPLOAD_SYMBOLS=$DO_UPLOAD_SYMBOLS" >> $GITHUB_ENV
        echo "DO_UPLOAD_SYMBOLS: $DO_UPLOAD_SYMBOLS"
        echo "SENTRY_PROJECT=$SENTRY_PROJECT" >> $GITHUB_ENV
        echo "SENTRY_PROJECT: $SENTRY_PROJECT"
        echo "SENTRY_URL=$SENTRY_URL" >> $GITHUB_ENV
        echo "SENTRY_URL: $SENTRY_URL"

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Register gcc problem matcher
      run: echo "::add-matcher::.github/problem_matchers/gcc.json"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.1'
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Setup environment
      if: env.DO_BUILD == 'true'
      run: |
        bash ${CI_DIR}/linux/setup.sh

    - name: Build
      if: env.DO_BUILD == 'true'
      run: |
        C_URL=${SENTRY_URL}; if [ -z "$C_URL" ]; then C_URL="''"; fi
        source $HOME/build_tools/environment.sh
        cmake -DCRASH_REPORT_URL=$C_URL -P ${CI_DIR}/linux/ci_build.cmake

    - name: Show ccache stats
      run: |
        ccache -sv

    - name: Check bundled deps are self-contained
      if: env.DO_BUILD == 'true'
      run: |
        APP=$(find build.install -type f -name 'audacity4*' -path '*bin*' -print -quit)
        bash ${CI_DIR}/linux/check_self_contained.sh "$APP"

    - name: Upload build for self-test
      if: env.DO_BUILD == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: selftest-build-linux-${{ matrix.arch }}
        path: ./build.install/
        retention-days: 1

    - name: Package
      if: env.DO_BUILD == 'true'
      run: |
        cmake -DPACKARCH=${{ matrix.arch }} -P ${CI_DIR}/linux/package.cmake

    - name: Generate and upload dump symbols
      if: env.DO_UPLOAD_SYMBOLS == 'true'
      shell: bash
      run: |
        APP_BIN=$(find "$(pwd)/build.release/src/app/" -type f -name "audacity4portable*" -print -quit)
        sudo cmake -DAPP_BIN=${APP_BIN} \
                   -DSENTRY_URL=https://sentry.audacityteam.org \
                   -DSENTRY_ORG=sentry \
                   -DSENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
                   -DSENTRY_PROJECT=${SENTRY_PROJECT} \
                   -P muse/buildscripts/ci/crashdumps/ci_generate_and_upload.cmake

    - name: Upload artifacts on GitHub
      if: env.DO_BUILD == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: |
          ./build.artifacts/
          !./build.artifacts/symbols/**

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  plugin-registration-self-test:
    needs: au4_build_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64,  qt_host: linux,       qt_arch: linux_gcc_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.app_repo || job.workflow_repository }}
        ref: ${{ inputs.app_ref || job.workflow_sha }}
        persist-credentials: false

    - name: Setup environment
      run: |
        bash ${CI_DIR}/linux/setup.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.1'
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Download build artifact
      uses: actions/download-artifact@v6
      with:
        name: selftest-build-linux-${{ matrix.arch }}
        path: ./build.install

    - name: Run plugin registration app self-test
      run: |
        source $HOME/build_tools/environment.sh
        export LD_LIBRARY_PATH="./build.install/lib:${LD_LIBRARY_PATH}"
        find ./build.install/bin/ -type f -exec chmod +x {} +
        APP_BIN=$(find "./build.install/bin/" -type f -name "audacity4portable*" -print -quit)
        QT_QPA_PLATFORM=minimal:enable_fonts "$APP_BIN" --plugin-registration-self-test

  testflow-discover:
    # Lists the test scripts so that testflow-linux can fan out one job per
    # script. Reads the repo (same commit the AppImage is built from) instead
    # of the artifact, so it runs in parallel with the build.
    runs-on: ubuntu-22.04
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.app_repo || job.workflow_repository }}
        ref: ${{ inputs.app_ref || job.workflow_sha }}
        persist-credentials: false
        # These are gitignore-style patterns; a trailing "# comment" would
        # become part of the pattern. buildscripts/ci/tools is needed for
        # list_testflow_scripts.sh.
        sparse-checkout: |
          share/testflowscripts
          buildscripts/ci/tools

    - name: List test scripts
      id: list
      # Disabled test cases are listed in share/testflowscripts/disabled.json
      run: |
        scripts=$(bash ${CI_DIR}/tools/list_testflow_scripts.sh)
        echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
        echo "Discovered: $scripts"

  testflow-linux:
    needs: [au4_build_linux, testflow-discover]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false # let sibling test cases finish even if one fails
      # A job-level `if` cannot see the matrix context (it is evaluated before
      # the matrix expands), so disabled test cases are handled with step-level
      # conditions instead: their job runs, labeled DISABLED, with every step
      # skipped.
      matrix: ${{ fromJSON(needs.testflow-discover.outputs.scripts) }}
    steps:
    # No checkout: everything this job runs comes from the AppImage artifact.

    - name: Report disabled test case
      if: matrix.status == 'DISABLED'
      env:
        SCRIPT: ${{ matrix.script }}
      run: echo "::warning title=Test case disabled::$SCRIPT is disabled - see share/testflowscripts/disabled.json for the reason"

    - name: Setup environment
      if: matrix.status != 'DISABLED'
      # The AppImage bundles Qt and most libraries; this installs a virtual
      # display plus exactly the libraries the AppImage excludelist leaves to
      # the host: the full GLVND family (the app links libOpenGL/libGLX
      # directly), X client libs, fontconfig/freetype, and ALSA.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          xvfb openbox dbus-x11 \
          libgl1 libglx0 libopengl0 libegl1 \
          libx11-6 libx11-xcb1 libxcb1 \
          libfontconfig1 libfreetype6 libexpat1 \
          libasound2

    - name: Download AppImage artifact
      if: matrix.status != 'DISABLED'
      # The artifact name is dynamic (AU4_<build_number>_Lin_x86_64_<info>),
      # so match it by pattern.
      uses: actions/download-artifact@v6
      with:
        pattern: AU4_*_Lin_x86_64_*
        merge-multiple: true
        path: ./build.artifacts

    - name: Run testflow test case
      if: matrix.status != 'DISABLED'
      env:
        SCRIPT: ${{ matrix.script }}
      run: |
        APPIMAGE=$(find ./build.artifacts -type f -name '*.AppImage' -print -quit)
        test -n "$APPIMAGE" || { echo "AppImage not found in artifact"; exit 1; }
        chmod +x "$APPIMAGE"
        # Extract instead of mounting, so the runner doesn't need libfuse2
        "$APPIMAGE" --appimage-extract > /dev/null
        APP_BIN="$PWD/squashfs-root/AppRun"
        SCRIPTS_DIR=$(find "$PWD/squashfs-root" -type d -name "testflowscripts" -print -quit)
        test -n "$SCRIPTS_DIR" || { echo "testflowscripts not found in AppImage (release build?)"; exit 1; }

        tc="$SCRIPTS_DIR/$SCRIPT"
        test -f "$tc" || { echo "script not in AppImage: $SCRIPT"; exit 1; }

        # A leftover instance would swallow the args and exit 0 = false PASS
        export AU_ALLOW_MULTIPLE_PROCESSES=1
        export MUSE_TESTFLOW_DATA_PATH="$PWD/testflow_data"
        # Fresh profile: no settings/recent-projects/session-restore leakage
        SANDBOX=$(mktemp -d)
        export XDG_CONFIG_HOME="$SANDBOX/config" XDG_DATA_HOME="$SANDBOX/data" \
               XDG_CACHE_HOME="$SANDBOX/cache" XDG_STATE_HOME="$SANDBOX/state"

        # Let run 5mn, then kill it after 15s if it doesn't exit on its own
        rc=0
        timeout -k 15 300 xvfb-run -a -s "-screen 0 1600x1000x24" \
          "$APP_BIN" --test-case "$tc" --test-case-speed Fast || rc=$?
        # Forward testflow output to the job log
        find "$PWD/testflow_data" -name '*.txt' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true
        test "$rc" -eq 124 && echo "timed out"
        exit $rc

  delete-selftest-artifacts:
    # testflow-linux consumes the packaged artifact, not the selftest one,
    # so only the self-test job needs to be waited for
    needs: [plugin-registration-self-test]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
    - name: Delete self-test artifact
      uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
      with:
        failOnError: false
        name: selftest-build-linux-${{ matrix.arch }}
