name: '[AU4] Build: Linux'

on:
  pull_request:
    branches:
    - master
    paths-ignore:
    - 'docs/**'
    - '**.md'
    - '.github/ISSUE_TEMPLATE/**'
    - 'LICENSE*'

  schedule:
    - cron: '0 3 */1 */1 *' # At 03:00 on every day-of-month for master
  #   - cron: '0 5 */1 */1 *' # At 05:00 on every day-of-month for current release branch
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel_build, nightly_build, testing_build, stable_build'
        required: true
        default: 'devel_build'
      sentry_project:
        description: 'Upload symbols and dumps to Sentry (choose a project): au4(default for stable build), au4-sandbox'
        required: false
        default: ''

  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode (devel_build, nightly_build, testing_build, stable_build)'
        type: string
        required: false
        default: 'devel_build'
      app_repo:
        description: 'owner/repo to source Audacity from (default: this repo)'
        type: string
        required: false
        default: ''
      app_ref:
        description: 'Audacity ref to check out (default: ref of triggering event)'
        type: string
        required: false
        default: ''
      framework_repo:
        description: 'owner/repo to source muse_framework from (default: pinned submodule)'
        type: string
        required: false
        default: ''
      framework_ref:
        description: 'Ref to check out into the muse_framework submodule (default: pinned SHA)'
        type: string
        required: false
        default: ''

concurrency:
  group: au4_build_linux-${{ github.ref }}-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  CI_DIR: buildscripts/ci

jobs:
  nightly_gate:
    # Scheduled builds check out muse_framework@main, so a nightly is only redundant when
    # neither this repo's master nor muse_framework's main has moved since the last one.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      stamp_key: ${{ steps.inputs.outputs.stamp_key }}
    steps:
    - name: Resolve nightly inputs
      id: inputs
      run: |
        MUSE_SHA=$(git ls-remote https://github.com/musescore/muse_framework.git refs/heads/main | cut -f1)
        echo "muse_sha=${MUSE_SHA}" >> $GITHUB_OUTPUT
        echo "stamp_key=nightly-stamp-au4_build_linux-${{ github.sha }}-${MUSE_SHA}" >> $GITHUB_OUTPUT

    - name: Look up whether these inputs were already built
      id: stamp
      uses: actions/cache/restore@v5
      with:
        path: .nightly-stamp
        key: ${{ steps.inputs.outputs.stamp_key }}
        lookup-only: true

    - name: Decide
      id: decide
      run: |
        if [ "${{ steps.stamp.outputs.cache-hit }}" == "true" ]; then
          echo "should_build=false" >> $GITHUB_OUTPUT
          echo "::notice::Nightly skipped: master ${{ github.sha }} + muse_framework@main ${{ steps.inputs.outputs.muse_sha }} were already built."
        else
          echo "should_build=true" >> $GITHUB_OUTPUT
        fi

  au4_build_linux:
    needs: nightly_gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly_gate.outputs.should_build != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64,  qt_host: linux,       qt_arch: linux_gcc_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.app_repo || github.repository }}
        ref: ${{ inputs.app_ref || github.ref }}
        submodules: recursive

    - name: Override muse_framework
      if: inputs.framework_ref != '' || github.event_name == 'schedule'
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.framework_repo || 'musescore/muse_framework' }}
        ref: ${{ inputs.framework_ref || 'main' }}
        path: muse
        submodules: recursive

    - name: "Configure workflow"
      env:
        pull_request_title: ${{ github.event.pull_request.title }}
        SENTRY_SERVER_AU4_KEY: ${{ secrets.SENTRY_SERVER_AU4_KEY }}
        SENTRY_SERVER_AU4_PLUGIN_VALIDATION_KEY: ${{ secrets.SENTRY_SERVER_AU4_PLUGIN_VALIDATION_KEY }}
        SENTRY_SERVER_AU4_SANDBOX_PLUGIN_VALIDATION_KEY: ${{ secrets.SENTRY_SERVER_AU4_SANDBOX_PLUGIN_VALIDATION_KEY }}
        SENTRY_SERVER_AU4_SANDBOX_KEY: ${{ secrets.SENTRY_SERVER_AU4_SANDBOX_KEY }}
        SENTRY_PROJECT: ${{ github.event.inputs.sentry_project }}
      run: |

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "schedule" ] && [ "${{ github.event.schedule }}" == "0 5 */1 */1 *" ]; then ADD_INFO="_${{ env.CURRENT_RELEASE_BRANCH }}"; fi
        if [ "${{ github.event_name }}" == "pull_request" ]; then ADD_INFO="_${{ github.event.pull_request.number }}_${pull_request_title}"; fi

        BUILD_MODE=${{ inputs.build_mode || github.event.inputs.build_mode }}

        cmake -DEVENT=${{ github.event_name }} \
              -DBUILD_MODE=${BUILD_MODE} \
              -DARTIFACT_INFO="Lin_${{ matrix.arch }}${ADD_INFO}" \
              -P ${CI_DIR}/common/ci_configure.cmake

        # build_mode is only set when the workflow is run manually or called by another workflow.
        # On schedule events, take the mode ci_configure.cmake derived from the event instead.
        if [ -z "$BUILD_MODE" ]; then
          BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)
        fi
        echo "BUILD_MODE: $BUILD_MODE"

        DO_BUILD='true'
        UPLOAD_ARTIFACT_NAME=$(cat ./build.artifacts/env/artifact_name.env)

        PROJECT_ID=""
        APP_KEY=""
        PLUGIN_KEY=""

        case "${SENTRY_PROJECT:-$BUILD_MODE}" in
          au4|stable_build)
            SENTRY_PROJECT="au4"
            PROJECT_ID=4
            APP_KEY="$SENTRY_SERVER_AU4_KEY"
            PLUGIN_KEY="$SENTRY_SERVER_AU4_PLUGIN_VALIDATION_KEY"
            ;;
          au4-sandbox|nightly_build)
            SENTRY_PROJECT="au4-sandbox"
            PROJECT_ID=5
            APP_KEY="$SENTRY_SERVER_AU4_SANDBOX_KEY"
            PLUGIN_KEY="$SENTRY_SERVER_AU4_SANDBOX_PLUGIN_VALIDATION_KEY"
            ;;
        esac

        DO_UPLOAD_SYMBOLS=false
        SENTRY_URL=""
        SENTRY_PLUGIN_VALIDATION_URL=""

        if [ -n "$PROJECT_ID" ]; then
          BASE_URL="https://sentry.audacityteam.org/api/$PROJECT_ID/minidump/"

          if [ -n "$APP_KEY" ]; then
            SENTRY_URL="${BASE_URL}?sentry_key=$APP_KEY"
            DO_UPLOAD_SYMBOLS=true
          fi

          if [ -n "$PLUGIN_KEY" ]; then
            SENTRY_PLUGIN_VALIDATION_URL="${BASE_URL}?sentry_key=$PLUGIN_KEY"
            DO_UPLOAD_SYMBOLS=true
          fi
        fi

        # Sandbox builds are superseded daily; their symbols would only pile up on the server.
        if [ "$SENTRY_PROJECT" == "au4-sandbox" ]; then
          DO_UPLOAD_SYMBOLS=false
        fi

        echo "DO_BUILD=$DO_BUILD" >> $GITHUB_ENV
        echo "DO_BUILD: $DO_BUILD"
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" >> $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME: $UPLOAD_ARTIFACT_NAME"

        echo "DO_UPLOAD_SYMBOLS=$DO_UPLOAD_SYMBOLS" >> $GITHUB_ENV
        echo "DO_UPLOAD_SYMBOLS: $DO_UPLOAD_SYMBOLS"
        echo "SENTRY_PROJECT=$SENTRY_PROJECT" >> $GITHUB_ENV
        echo "SENTRY_PROJECT: $SENTRY_PROJECT"
        echo "SENTRY_URL=$SENTRY_URL" >> $GITHUB_ENV
        echo "SENTRY_URL: $SENTRY_URL"
        echo "SENTRY_PLUGIN_VALIDATION_URL=$SENTRY_PLUGIN_VALIDATION_URL" >> $GITHUB_ENV
        echo "SENTRY_PLUGIN_VALIDATION_URL: $SENTRY_PLUGIN_VALIDATION_URL"

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Register gcc problem matcher
      run: echo "::add-matcher::.github/problem_matchers/gcc.json"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.1'
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Setup environment
      if: env.DO_BUILD == 'true'
      run: |
        bash ${CI_DIR}/linux/setup.sh

    - name: Build
      if: env.DO_BUILD == 'true'
      run: |
        C_URL=${SENTRY_URL}; if [ -z "$C_URL" ]; then C_URL="''"; fi
        C_URL_PV=${SENTRY_PLUGIN_VALIDATION_URL}; if [ -z "$C_URL_PV" ]; then C_URL_PV="''"; fi
        source $HOME/build_tools/environment.sh
        cmake -DCRASH_REPORT_URL=$C_URL -DAUDIOPLUGINS_CRASHREPORT_URL=$C_URL_PV -P ${CI_DIR}/linux/ci_build.cmake

    - name: Show ccache stats
      run: |
        ccache -sv

    - name: Check bundled deps are self-contained
      if: env.DO_BUILD == 'true'
      run: |
        APP=$(find build.install -type f -name 'audacity4*' -path '*bin*' -print -quit)
        bash ${CI_DIR}/linux/check_self_contained.sh "$APP"

    - name: Upload build for self-test
      if: env.DO_BUILD == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: selftest-build-linux-${{ matrix.arch }}
        path: ./build.install/
        retention-days: 1

    - name: Package
      if: env.DO_BUILD == 'true'
      run: |
        cmake -DPACKARCH=${{ matrix.arch }} -P ${CI_DIR}/linux/package.cmake

    - name: Generate and upload dump symbols
      if: env.DO_UPLOAD_SYMBOLS == 'true'
      shell: bash
      run: |
        APP_BIN=$(find "$(pwd)/build.release/src/app/" -type f -name "audacity4portable*" -print -quit)
        sudo cmake -DAPP_BIN=${APP_BIN} \
                   -DSENTRY_URL=https://sentry.audacityteam.org \
                   -DSENTRY_ORG=sentry \
                   -DSENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
                   -DSENTRY_PROJECT=${SENTRY_PROJECT} \
                   -P muse/buildscripts/ci/crashdumps/ci_generate_and_upload.cmake

    - name: Upload artifacts on GitHub
      if: env.DO_BUILD == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: |
          ./build.artifacts/
          !./build.artifacts/symbols/**

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  nightly_stamp:
    # Record the (master, muse_framework@main) pair as built, on success or failure (a deterministic
    # failure would just go red again tomorrow; re-run by hand or via workflow_dispatch if it was flaky).
    needs: [nightly_gate, au4_build_linux]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.nightly_gate.outputs.should_build == 'true' && contains(fromJSON('["success","failure"]'), needs.au4_build_linux.result) }}
    runs-on: ubuntu-latest
    steps:
    - run: echo "${{ needs.au4_build_linux.result }}" > .nightly-stamp

    - uses: actions/cache/save@v5
      with:
        path: .nightly-stamp
        key: ${{ needs.nightly_gate.outputs.stamp_key }}

  plugin-registration-self-test:
    needs: au4_build_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64,  qt_host: linux,       qt_arch: linux_gcc_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.app_repo || job.workflow_repository }}
        ref: ${{ inputs.app_ref || job.workflow_sha }}
        persist-credentials: false

    - name: Setup environment
      run: |
        bash ${CI_DIR}/linux/setup.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.1'
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: selftest-build-linux-${{ matrix.arch }}
        path: ./build.install

    - name: Run plugin registration app self-test
      run: |
        source $HOME/build_tools/environment.sh
        export LD_LIBRARY_PATH="./build.install/lib:${LD_LIBRARY_PATH}"
        find ./build.install/bin/ -type f -exec chmod +x {} +
        APP_BIN=$(find "./build.install/bin/" -type f -name "audacity4portable*" -print -quit)
        QT_QPA_PLATFORM=minimal:enable_fonts "$APP_BIN" --plugin-registration-self-test

  testflow:
    needs: au4_build_linux
    permissions:  
      actions: read  
      contents: read
    # Stable builds have testflow compiled out, so there is nothing to run
    if: >-
      !cancelled()
      && needs.au4_build_linux.result == 'success'
      && (inputs.build_mode || github.event.inputs.build_mode || 'devel_build') != 'stable_build'
    uses: ./.github/workflows/au4_testflow.yml
    with:
      app_repo: ${{ inputs.app_repo || '' }}
      app_ref: ${{ inputs.app_ref || '' }}


  delete-selftest-artifacts:
    # Only the self-test job uses this artifact, testflow takes the packaged one
    needs: [plugin-registration-self-test]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
    - name: Delete self-test artifact
      uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
      with:
        failOnError: false
        name: selftest-build-linux-${{ matrix.arch }}
