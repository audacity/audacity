name: '[AU4] Build: macOS'

on:
  pull_request:
    branches:
    - master
    paths-ignore:
    - 'docs/**'
    - '**.md'
    - '.github/ISSUE_TEMPLATE/**'
    - 'LICENSE*'

  schedule:
    - cron: '0 3 */1 */1 *' # At 03:00 on every day-of-month for master
  #   - cron: '0 5 */1 */1 *' # At 05:00 on every day-of-month for current release branch
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel_build, nightly_build, testing_build, stable_build'
        required: true
        default: 'devel_build'

      sentry_project:
        description: 'Upload symbols and dumps to Sentry (choose a project): au4(default for stable build), au4-sandbox'
        required: false
        default: ''

  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode (devel_build, nightly_build, testing_build, stable_build)'
        type: string
        required: false
        default: 'devel_build'
      app_repo:
        description: 'owner/repo to source Audacity from (default: this repo)'
        type: string
        required: false
        default: ''
      app_ref:
        description: 'Audacity ref to check out (default: ref of triggering event)'
        type: string
        required: false
        default: ''
      framework_repo:
        description: 'owner/repo to source muse_framework from (default: pinned submodule)'
        type: string
        required: false
        default: ''
      framework_ref:
        description: 'Ref to check out into the muse_framework submodule (default: pinned SHA)'
        type: string
        required: false
        default: ''

concurrency:
  group: au4_build_macos-${{ github.ref }}-${{ inputs.framework_ref || '' }}
  cancel-in-progress: true

env:
  CI_DIR: buildscripts/ci
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  nightly_gate:
    # Scheduled builds check out muse_framework@main, so a nightly is only redundant when
    # neither this repo's master nor muse_framework's main has moved since the last one.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      stamp_key: ${{ steps.inputs.outputs.stamp_key }}
    steps:
    - name: Resolve nightly inputs
      id: inputs
      run: |
        MUSE_SHA=$(git ls-remote https://github.com/musescore/muse_framework.git refs/heads/main | cut -f1)
        echo "muse_sha=${MUSE_SHA}" >> $GITHUB_OUTPUT
        echo "stamp_key=nightly-stamp-au4_build_macos-${{ github.sha }}-${MUSE_SHA}" >> $GITHUB_OUTPUT

    - name: Look up whether these inputs were already built
      id: stamp
      uses: actions/cache/restore@v5
      with:
        path: .nightly-stamp
        key: ${{ steps.inputs.outputs.stamp_key }}
        lookup-only: true

    - name: Decide
      id: decide
      run: |
        if [ "${{ steps.stamp.outputs.cache-hit }}" == "true" ]; then
          echo "should_build=false" >> $GITHUB_OUTPUT
          echo "::notice::Nightly skipped: master ${{ github.sha }} + muse_framework@main ${{ steps.inputs.outputs.muse_sha }} were already built."
        else
          echo "should_build=true" >> $GITHUB_OUTPUT
        fi

  au4_build_macos:
    needs: nightly_gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly_gate.outputs.should_build != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: universal, osx_arch: 'x86_64;arm64' }
          - { arch: arm64,     osx_arch: arm64 }
          - { arch: x86_64,    osx_arch: x86_64 }
    runs-on: macos-26
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.app_repo || github.repository }}
        ref: ${{ inputs.app_ref || github.ref }}
        submodules: recursive

    - name: Override muse_framework
      if: inputs.framework_ref != '' || github.event_name == 'schedule'
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.framework_repo || 'musescore/muse_framework' }}
        ref: ${{ inputs.framework_ref || 'main' }}
        path: muse
        submodules: recursive

    - name: "Configure workflow"
      env:
        pull_request_title: ${{ github.event.pull_request.title }}
        SENTRY_SERVER_AU4_KEY: ${{ secrets.SENTRY_SERVER_AU4_KEY }}
        SENTRY_SERVER_AU4_SANDBOX_KEY: ${{ secrets.SENTRY_SERVER_AU4_SANDBOX_KEY }}
        SENTRY_PROJECT: ${{ github.event.inputs.sentry_project }}
      run: |
        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "schedule" ] && [ "${{ github.event.schedule }}" == "0 5 */1 */1 *" ]; then ADD_INFO="_${{ env.CURRENT_RELEASE_BRANCH }}"; fi
        if [ "${{ github.event_name }}" == "pull_request" ]; then ADD_INFO="_${{ github.event.pull_request.number }}_${pull_request_title}"; fi

        BUILD_MODE=${{ inputs.build_mode || github.event.inputs.build_mode }}

        DO_NOTARIZE='false'
        if [ "$BUILD_MODE" != "devel_build" ]; then
          DO_NOTARIZE='true'
          if [ -z "${{ secrets.APPLE_USERNAME }}" ]; then
            echo "::warning::APPLE_USERNAME is empty; notarization disabled"
            DO_NOTARIZE='false'
          elif [ -z "${{ secrets.APPLE_PASSWORD }}" ]; then
            echo "::warning::APPLE_PASSWORD is empty, notarization disabled"
            DO_NOTARIZE='false'
          fi
        fi

        cmake -DEVENT=${{ github.event_name }} \
              -DBUILD_MODE=${BUILD_MODE} \
              -DARTIFACT_INFO="Mac_${{ matrix.arch }}${ADD_INFO}" \
              -P ${CI_DIR}/common/ci_configure.cmake

        DO_BUILD='true'
        UPLOAD_ARTIFACT_NAME=$(cat ./build.artifacts/env/artifact_name.env)

        DO_UPLOAD_SYMBOLS='false'
        SENTRY_URL=""

        if [ "$SENTRY_SERVER_AU4_KEY" != "" ]; then
          if [ -z "$SENTRY_PROJECT" ] && [ "$BUILD_MODE" == "stable_build" ]; then
            SENTRY_PROJECT="au4"
          fi

          if [ "$SENTRY_PROJECT" == "au4" ]; then
            DO_UPLOAD_SYMBOLS='true'
            SENTRY_URL=https://sentry.audacityteam.org/api/4/minidump/?sentry_key=$SENTRY_SERVER_AU4_KEY
          fi
        fi

        if [ -z "$SENTRY_PROJECT" ] && [ "$BUILD_MODE" == "nightly_build" ]; then
          SENTRY_PROJECT="au4-sandbox"
        fi

        if [ "$SENTRY_PROJECT" == "au4-sandbox" ] && [ "$SENTRY_SERVER_AU4_SANDBOX_KEY" != "" ]; then
          DO_UPLOAD_SYMBOLS='true'
          SENTRY_URL=https://sentry.audacityteam.org/api/5/minidump/?sentry_key=$SENTRY_SERVER_AU4_SANDBOX_KEY
        fi

        echo "DO_BUILD=$DO_BUILD" >> $GITHUB_ENV
        echo "DO_BUILD: $DO_BUILD"
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" >> $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME: $UPLOAD_ARTIFACT_NAME"

        echo "DO_NOTARIZE=$DO_NOTARIZE" | tee -a $GITHUB_ENV

        echo "DO_UPLOAD_SYMBOLS=$DO_UPLOAD_SYMBOLS" >> $GITHUB_ENV
        echo "DO_UPLOAD_SYMBOLS: $DO_UPLOAD_SYMBOLS"
        echo "SENTRY_PROJECT=$SENTRY_PROJECT" >> $GITHUB_ENV
        echo "SENTRY_PROJECT: $SENTRY_PROJECT"
        echo "SENTRY_URL=$SENTRY_URL" >> $GITHUB_ENV
        echo "SENTRY_URL: $SENTRY_URL"

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        brew install ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.1'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Setup environment
      if: env.DO_BUILD == 'true'
      run: |
        bash ${CI_DIR}/macos/setup.sh

    - name: Build
      if: env.DO_BUILD == 'true'
      env:
        OSX_ARCHITECTURES: ${{ matrix.osx_arch }}
      run: |
        C_URL=${SENTRY_URL}; if [ -z "$C_URL" ]; then C_URL="''"; fi
        source $HOME/build_tools/environment.sh
        cmake -DCRASH_REPORT_URL=$C_URL -P ${CI_DIR}/macos/ci_build.cmake

    - name: Show ccache stats
      run: |
        ccache -sv

    - name: Upload build for self-test
      if: env.DO_BUILD == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: selftest-build-macos-${{ matrix.arch }}
        path: ./build.install/
        retention-days: 1

    - name: Package
      env:
        SIGN_CERTIFICATE_ENCRYPT_SECRET: ${{ secrets.MAC_SIGN_CERTIFICATE_ENCRYPT_SECRET }}
        SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGN_CERTIFICATE_PASSWORD }}
      if: env.DO_BUILD == 'true'
      run: |
        source $HOME/build_tools/environment.sh
        cmake -DPACKARCH=${{ matrix.arch }} -P ${CI_DIR}/macos/package.cmake

    - name: Notarize
      if: env.DO_NOTARIZE == 'true'
      run: |
        USER=${{ secrets.APPLE_USERNAME }}; if [ -z "$USER" ]; then USER=""; fi
        PW=${{ secrets.APPLE_PASSWORD }}; if [ -z "$PW" ]; then PW=""; fi
        bash ./buildscripts/ci/macos/notarize.sh -u $USER -p $PW
    - name: Generate and upload dump symbols
      if: env.DO_UPLOAD_SYMBOLS == 'true'
      shell: bash
      run: |
        APP_BIN=$(pwd)/build.install/audacity.app/Contents/MacOS/audacity
        GENERATE_ARCHS="${{ matrix.arch }}"
        if [ "$GENERATE_ARCHS" == "universal" ]; then
          GENERATE_ARCHS="x86_64 arm64"
        fi
        BUILD_DIR=$(pwd)/build.install

        cmake -DAPP_BIN=${APP_BIN} \
              -DGENERATE_ARCHS="${GENERATE_ARCHS}" \
              -DBUILD_DIR=${BUILD_DIR} \
              -DSENTRY_URL=https://sentry.audacityteam.org \
              -DSENTRY_ORG=sentry \
              -DSENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
              -DSENTRY_PROJECT=${SENTRY_PROJECT} \
              -P muse/buildscripts/ci/crashdumps/ci_generate_and_upload.cmake

    - name: Upload artifacts on GitHub
      if: env.DO_BUILD == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: |
          ./build.artifacts/
          !./build.artifacts/symbols/**

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  nightly_stamp:
    # Record the (master, muse_framework@main) pair as built, on success or failure (a deterministic
    # failure would just go red again tomorrow; re-run by hand or via workflow_dispatch if it was flaky).
    needs: [nightly_gate, au4_build_macos]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.nightly_gate.outputs.should_build == 'true' && contains(fromJSON('["success","failure"]'), needs.au4_build_macos.result) }}
    runs-on: ubuntu-latest
    steps:
    - run: echo "${{ needs.au4_build_macos.result }}" > .nightly-stamp

    - uses: actions/cache/save@v5
      with:
        path: .nightly-stamp
        key: ${{ needs.nightly_gate.outputs.stamp_key }}

  plugin-registration-self-test:
    needs: au4_build_macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: universal }
          - { arch: arm64 }
          - { arch: x86_64 }
    runs-on: macos-26
    steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.1'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Download build artifact
      uses: actions/download-artifact@v6
      with:
        name: selftest-build-macos-${{ matrix.arch }}
        path: ./build.install

    - name: Run plugin registration app self-test
      run: |
        chmod +x ./build.install/audacity.app/Contents/MacOS/audacity
        ./build.install/audacity.app/Contents/MacOS/audacity --plugin-registration-self-test

    - name: Delete self-test artifact
      if: always()
      uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
      with:
        failOnError: false
        name: selftest-build-macos-${{ matrix.arch }}
